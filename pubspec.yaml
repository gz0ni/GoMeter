name: gometer
description: "GoMeter — OpenCode Go subscription limits tracker."
publish_to: 'none'

version: 0.2.2+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  dio: ^5.11.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  path: ^1.9.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  image: ^4.5.2
  flutter_launcher_icons: ^0.14.1
  args: ^2.5.0

flutter_launcher_icons:
  image_path: "assets/images/png/icon-1024.png"
  android: true
  adaptive_icon_foreground: "assets/images/png/icon-1024.png"
  adaptive_icon_background: "assets/images/png/icon-1024.png"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/images/png/icon-1024.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/png/icon-1024.png"
  linux:
    generate: true
    image_path: "assets/images/png/icon-1024.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/png/
    - assets/images/ico/
