name: build

on:
  push:
    tags:
      - 'v*'

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.44.8'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

  build:
    needs: [ test ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing
        if: startsWith(matrix.platform, 'android')
        run: |
          set -e
          echo "${{ secrets.KEYSTORE }}" | sed 's/^KEYSTORE=//' | base64 --decode > android/app/keystore.jks
          if [ ! -s android/app/keystore.jks ]; then
            echo "Keystore decode failed or empty. Check the KEYSTORE secret (must be base64, optionally prefixed with KEYSTORE=)."
            exit 1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.STORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "Android signing secrets incomplete: KEY_ALIAS/STORE_PASSWORD/KEY_PASSWORD must be set alongside KEYSTORE."
            exit 1
          fi
          {
            echo "keyStore=app/keystore.jks"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties
          echo "Android signing configured: keystore $(wc -c < android/app/keystore.jks) bytes, alias=${{ secrets.KEY_ALIAS }}"
          echo "local.properties:"
          cat android/local.properties
          ls -l android/app/keystore.jks

      - name: Setup NDK
        if: startsWith(matrix.platform, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.arch != 'arm64' && env.FLUTTER_VERSION || '' }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Node for icon generation
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate icons from SVG (sharp)
        shell: bash
        run: |
          set -e
          npm install sharp --no-save
          node scripts/svg_to_png.mjs || echo "SVG rasterize skipped, using fallback PNG"
          dart run scripts/generate_launcher_assets.dart
          dart run flutter_launcher_icons || echo "flutter_launcher_icons failed but continuing"
          dart run scripts/generate_ico.dart

      - name: Setup Xcode (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          XCODE_APP=$(ls -1 /Applications | grep '^Xcode' | sort -V | tail -n1)
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      - name: Build Android
        if: startsWith(matrix.platform, 'android')
        run: dart setup.dart android --env stable -v

      - name: Build Windows
        if: startsWith(matrix.platform, 'windows')
        shell: powershell
        run: |
          choco install innosetup -y
          $iscc = Get-ChildItem -Path "C:\Program Files*" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($iscc) {
            $env:PATH += ";" + $iscc.DirectoryName
            Write-Host "Found ISCC at $($iscc.FullName)"
          } else {
            Write-Host "ISCC.exe not found after install"
          }
          dart setup.dart windows --env stable -v | Tee-Object -FilePath windows-build.log

      - name: Upload Windows build log on failure
        if: failure() && startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: windows-build.log
          if-no-files-found: ignore

      - name: Windows build summary on failure
        if: failure() && startsWith(matrix.platform, 'windows')
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows build log tail"
          if (Test-Path windows-build.log) {
            Get-Content windows-build.log -Tail 80 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "windows-build.log not found"
          }

      - name: Build Linux
        if: startsWith(matrix.platform, 'linux')
        run: dart setup.dart linux --env stable -v

      - name: Build macOS
        if: startsWith(matrix.platform, 'macos')
        run: dart setup.dart macos --env stable -v

      - name: List dist output
        run: ls -R dist || echo "dist directory missing"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  release:
    name: Release
    if: ${{ !contains(github.ref, '-') }}
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release body
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import glob, os, re

          tag = os.environ['GITHUB_REF_NAME']
          repo = os.environ['GITHUB_REPOSITORY']
          base = f'https://github.com/{repo}/releases/download/{tag}'
          files = sorted(glob.glob('dist/*'))

          def badge(label, color):
              safe = label.replace(' ', '%20').replace('-', '--')
              return f'![{label}](https://img.shields.io/badge/{safe}-{color})'

          rows = []
          for path in files:
              name = os.path.basename(path)
              low = name.lower()
              if low.endswith('.apk'):
                  if 'arm64' in low or 'armv8' in low:
                      rows.append(('Android', badge('APK ARMv8', 'brightgreen'), name))
                  elif 'armeabi' in low or 'armv7' in low:
                      rows.append(('Android', badge('APK ARMv7', 'brightgreen'), name))
                  elif 'x86_64' in low:
                      rows.append(('Android', badge('APK x64', 'brightgreen'), name))
                  else:
                      rows.append(('Android', badge('APK', 'brightgreen'), name))
              elif low.endswith('.exe'):
                  rows.append(('Windows', badge('Setup x64', 'blue'), name))
              elif low.endswith('.zip') and 'windows' in low:
                  rows.append(('Windows', badge('Portable x64', 'lightblue'), name))
              elif low.endswith('.zip'):
                  rows.append(('Windows', badge('Portable x64', 'lightblue'), name))
              elif low.endswith('.dmg'):
                  rows.append(('macOS', badge('DMG Apple Silicon', 'purple'), name))
              elif low.endswith('.deb'):
                  rows.append(('Linux', badge('DebPackage x64', 'orange'), name))
              elif low.endswith('.rpm'):
                  rows.append(('Linux', badge('RpmPackage x64', 'yellow'), name))
              elif low.endswith('.tar.gz'):
                  rows.append(('Linux', badge('tar.gz x64', 'lightgrey'), name))
              elif 'appimage' in low:
                  rows.append(('Linux', badge('AppImage x64', 'red'), name))

          os_order = ['Android', 'Windows', 'macOS', 'Linux']
          grouped = {os: [] for os in os_order}
          for os, badge_md, name in rows:
              if os in grouped:
                  grouped[os].append((badge_md, name))

          lines = [
              '## Download based on your OS:',
              '',
              '| OS | Download |',
              '|---|---|',
          ]
          for os in os_order:
              links = grouped[os]
              if not links:
                  continue
              cell = ' \u00b7 '.join(
                  f'[{badge_md}]({base}/{name})' for badge_md, name in links
              )
              lines.append(f'| {os} | {cell} |')

          with open('RELEASE_BODY.md', 'w') as f:
              f.write('\n'.join(lines))
              f.write('\n')
          PY

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: RELEASE_BODY.md
